<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA-Grade Dispatch Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        nasa: {
                            blue: '#00d2ff',
                            darkBg: '#070a13',
                            panelBg: 'rgba(15, 23, 42, 0.75)',
                            accent: '#00f0ff',
                            amber: '#ffaa00',

    <style>
        body {
            background-color: #050811;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(13, 20, 36, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.1);
        }

        .active-nasa-tab {
            background: linear-gradient(180deg, rgba(0, 210, 255, 0.25) 0%, rgba(0, 210, 255, 0.05) 100%);
            border-bottom: 2px solid #00f0ff;
            color: #00f0ff;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
        }

        .neon-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(0,210,255,0.2) 0%, rgba(0,100,255,0.4) 100%);
            border: 1px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: all 0.2s ease;
        }

        .neon-btn:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            transform: translateY(-1px);
        }

        .neon-btn:active {
            transform: translateY(1px);
        }

        /* Scanline effect */
        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.3;
        }
    </style>
</head>

    <script>
        // Webhook URLs
        const WEBHOOK_URLS = {
            'lot': "https://default5b4308bc4f164e8daab026cc3b6f4b.ec.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/12/workflows/bd269a4140c941afb3c5161741aa6acc/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Y2GLVqrjxvNXGqnxLQz_pvo9i_hM51FDlLrY82kpm_Q",
            'empty': "https://default5b4308bc4f164e8daab026cc3b6f4b.ec.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/19f5740b6caa43bd87d2ec8857429157/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=dwMjbqODAZ7l8jwU0rFB729vZnE11yQB2ZVJ44gPbcM",
            'loaded': "https://default5b4308bc4f164e8daab026cc3b6f4b.ec.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/19/workflows/922d3c76ffc74d61914b765ff74365cb/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=LeaWHNLRnW0JdX9fvPTmIdIHclBa4E3_daPpoZuX3Ro",
            'gasket': "https://default5b4308bc4f164e8daab026cc3b6f4b.ec.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/07/workflows/331defa6578a404382985ca428dce473/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Fq5eC1UZGbxkIwfpruSBnd7fGB7_gmmokpNxiVVvF1Y"
        };

        // Synthesize Sci-Fi Sound FX using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSciFiSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
                }
            } catch(e){}
        }

        function sanitizeInput(val) {
            return val.toUpperCase().replace(/[^A-Z0-9_-]/g, '');
        }

        function syncContainerNo(val) {
            const cleanVal = sanitizeInput(val);
            document.querySelectorAll('.container-no-input').forEach(input => {
                input.value = cleanVal;
            });
        }

        const FOLDER_TYPES = {
            'lot': 'Lot Pic',
            'empty': 'Empty Container Pic',
            'loaded': 'Loaded Container Pic',
            'gasket': 'Container Gasket Pic'
        };

        const fileStore = { 'lot': [], 'empty': [], 'loaded': [], 'gasket': [] };
        let activeCategoryKey = 'lot';

        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const statusMessage = document.getElementById('statusMessage');

        // Clock & Date Initialization (Indian Standard Time - IST)
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false });
            const dateString = now.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');
            
            document.getElementById('liveClock').innerText = timeString + ' IST';
            document.getElementById('currentDateBadge').innerText = dateString;
        }
        setInterval(updateClock, 1000); updateClock();

        function switchTab(key) {
            playSciFiSound('click');
            activeCategoryKey = key;
            document.querySelectorAll('.tab-screen').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`screen-${key}`).classList.remove('hidden');

            document.querySelectorAll('.tab-screen button').forEach(b => b.classList.remove('active-nasa-tab'));
            document.querySelectorAll(`[id^='tab-']`).forEach(btn => btn.classList.remove('active-nasa-tab'));
            document.getElementById(`tab-${key}`).classList.add('active-nasa-tab');

            hideStatus();
        }

        function triggerCamera(key) {
            playSciFiSound('click');
            activeCategoryKey = key;
            cameraInput.click();
        }

        function triggerGallery(key) {
            playSciFiSound('click');
            activeCategoryKey = key;
            galleryInput.click();
        }

        // Image Processing pipeline (~500KB limit)
        async function processTo500KB(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');

                        let maxDimension = 2048;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        let targetQuality = 0.88;
                        let bestBlob = null;

                        const generateBlob = (q) => new Promise(res => canvas.toBlob(res, 'image/jpeg', q));

                        (async () => {
                            for (let i = 0; i < 4; i++) {
                                let blob = await generateBlob(targetQuality);
                                bestBlob = blob;
                                let sizeKB = blob.size / 1024;

                                if (sizeKB > 550) targetQuality *= 0.85;
                                else if (sizeKB < 400 && targetQuality < 0.92) targetQuality *= 1.1;
                                else break;
                            }

                            let finalSizeKB = Math.round(bestBlob.size / 1024);
                            let previewUrl = URL.createObjectURL(bestBlob);

                            canvas.width = 0; canvas.height = 0; canvas = null;
                            resolve({ blob: bestBlob, sizeKB: finalSizeKB, previewUrl });
                        })();
                    };
                };
            });
        }

        cameraInput.addEventListener('change', async (e) => {
            if (e.target.files.length > 0) {
                showStatus('OPTIMIZING IMAGE FREQUENCY MATRIX...', 'loading');
                const processed = await processTo500KB(e.target.files[0]);
                fileStore[activeCategoryKey].push(processed);
                renderPreviews(activeCategoryKey);
                cameraInput.value = '';
                hideStatus();
            }
        });

        galleryInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length > 0) {
                showStatus('OPTIMIZING MULTI-ARRAY FILES...', 'loading');
                for (let file of files) {
                    if (file.type.startsWith('image/')) {
                        const processed = await processTo500KB(file);
                        fileStore[activeCategoryKey].push(processed);
                    }
                }
                renderPreviews(activeCategoryKey);
                galleryInput.value = '';
                hideStatus();
            }
        });

        function renderPreviews(key) {
            const grid = document.getElementById(`previewGrid-${key}`);
            const countEl = document.getElementById(`photoCount-${key}`);
            const sizeEl = document.getElementById(`photoSize-${key}`);
            const list = fileStore[key];

            grid.innerHTML = '';
            let totalKB = list.reduce((acc, curr) => acc + curr.sizeKB, 0);
            let totalMB = (totalKB / 1024).toFixed(2);

            countEl.innerText = list.length;
            sizeEl.innerText = `${totalMB} MB`;

            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-6 text-center text-slate-600 font-mono text-xs tracking-wider">
                        NO OPTICAL DATA IN BUFFER
                    </div>
                `;
                return;
            }

            list.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'relative group aspect-square rounded-lg overflow-hidden border border-nasa-blue/40 bg-black/60 shadow-md';
                div.innerHTML = `
                    <img src="${item.previewUrl}" class="w-full h-full object-cover">
                    <span class="absolute bottom-1 left-1 bg-black/80 text-nasa-accent text-[9px] px-1 py-0.5 rounded font-mono">${item.sizeKB} KB</span>
                    <button type="button" onclick="removeFile('${key}', ${index})" 
                        class="absolute top-1 right-1 bg-rose-600/80 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px]">
                        ✕
                    </button>
                `;
                grid.appendChild(div);
            });
        }

        function removeFile(key, index) {
            playSciFiSound('click');
            fileStore[key].splice(index, 1);
            renderPreviews(key);
        }

        function clearForm(key) {
            playSciFiSound('click');
            fileStore[key] = [];
            renderPreviews(key);
            if (key === 'lot') document.getElementById('lotNo').value = '';
            else syncContainerNo('');
            hideStatus();
        }

        function showStatus(message, type) {
            statusMessage.className = 'mt-4 p-4 rounded-xl font-mono text-xs border transition-all shadow-lg backdrop-blur-md ';
            if (type === 'success') {
                statusMessage.className += 'bg-emerald-950/60 border-emerald-500/50 text-emerald-300';
            } else if (type === 'error') {
                statusMessage.className += 'bg-rose-950/60 border-rose-500/50 text-rose-300';
            } else {
                statusMessage.className += 'bg-cyan-950/60 border-cyan-500/50 text-cyan-300 animate-pulse';
            }
            statusMessage.innerHTML = message;
            statusMessage.classList.remove('hidden');
        }

        function hideStatus() {
            statusMessage.classList.add('hidden');
        }

        async function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function uploadCategory(key) {
            playSciFiSound('click');
            const targetWebhookUrl = WEBHOOK_URLS[key];

            if (!targetWebhookUrl) {
                alert(`WEBHOOK LINK NOT CONFIGURED FOR '${FOLDER_TYPES[key]}'`);
                return;
            }

            let identifierNo = key === 'lot' ? sanitizeInput(document.getElementById('lotNo').value) : sanitizeInput(document.getElementById(`containerNo-${key}`).value);

            if (!identifierNo) {
                alert(`SPECIFY A VALID ${key === 'lot' ? 'LOT' : 'CONTAINER'} ID!`);
                return;
            }

            const currentFiles = fileStore[key];
            if (currentFiles.length === 0) {
                alert(`CAPTURE AT LEAST 1 IMAGE FOR TRANSMISSION`);
                return;
            }

            const folderType = FOLDER_TYPES[key];
            const now = new Date();
            const dateIST = now.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');
            const timeIST = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false }).replace(/:/g, '-');
            const dateTimeStr = `${dateIST}_${timeIST}`;

            const submitBtn = document.getElementById(`submitBtn-${key}`);
            const btnIcon = document.getElementById(`btnIcon-${key}`);
            const btnText = document.getElementById(`btnText-${key}`);

            submitBtn.disabled = true;
            btnIcon.className = "fa-solid fa-atom fa-spin text-nasa-accent";
            btnText.innerText = "UPLOADING TO QUANTUM NODE...";
            showStatus(`TRANSMITTING DATA PACKETS TO <b>Export Pic / ${folderType}</b>...`, 'loading');

            try {
                const filesData = [];
                for (let i = 0; i < currentFiles.length; i++) {
                    const item = currentFiles[i];
                    const base64Content = await blobToBase64(item.blob);
                    const catClean = folderType.replace(/\s+/g, '');
                    
                    filesData.push({
                        fileName: `${identifierNo}_${catClean}_Pic_${i + 1}_${dateTimeStr}.jpg`,
                        contentBytes: base64Content
                    });
                }

                const payload = {
                    category: folderType,
                    lotNo: key === 'lot' ? identifierNo : '',
                    containerNo: key !== 'lot' ? identifierNo : '',
                    files: filesData
                };

                const response = await fetch(targetWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    playSciFiSound('success');
                    showStatus(`✔ QUANTUM TRANSMISSION COMPLETE. Saved to <b>Export Pic / ${folderType}</b>.`, 'success');
                    fileStore[key] = [];
                    renderPreviews(key);
                } else {
                    throw new Error(`Satellite response error code: ${response.status}`);
                }
            } catch (error) {
                console.error('Transmission Error:', error);
                showStatus('❌ TRANSMISSION FAILED. QUANTUM LINK TIMEOUT.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnIcon.className = "fa-solid fa-satellite-dish";
                btnText.innerText = "INITIATE QUANTUM TRANSMISSION";
            }
        }

        // Initialize Background Particle Grid Canvas
        (function initParticles() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let pts = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for(let i=0; i<45; i++) {
                pts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5
                });
            }

            function loop() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = 'rgba(0, 210, 255, 0.4)';
                ctx.strokeStyle = 'rgba(0, 210, 255, 0.08)';

                pts.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x<0||p.x>canvas.width) p.vx*=-1;
                    if(p.y<0||p.y>canvas.height) p.vy*=-1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1.5, 0, Math.PI*2);
                    ctx.fill();

                    for(let j=i+1; j<pts.length; j++) {
                        let p2 = pts[j];
                        let dist = Math.hypot(p.x-p2.x, p.y-p2.y);
                        if(dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                });
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // Init Previews
        Object.keys(FOLDER_TYPES).forEach(key => renderPreviews(key));
    </script>
